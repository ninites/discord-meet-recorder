services:
  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN manquant dans .env}
      DATA_DIR: /data
      AUTO_STOP_EMPTY_SECONDS: ${AUTO_STOP_EMPTY_SECONDS:-60}
      MAX_MEETING_MINUTES: ${MAX_MEETING_MINUTES:-180}
      STOP_PHRASE: ${STOP_PHRASE:-}
      AUTO_JOIN_CHANNELS: ${AUTO_JOIN_CHANNELS:-}
    volumes:
      - meetings:/data
    # Laisse le temps d'écrire les dernières prises de parole à l'arrêt.
    stop_grace_period: 30s

  transcriber:
    build: ./transcriber
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-fr}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-}
      KEEP_AUDIO: ${KEEP_AUDIO:-false}
      STOP_PHRASE: ${STOP_PHRASE:-}
      WHISPER_STOP_MODEL: ${WHISPER_STOP_MODEL:-small}
    volumes:
      - meetings:/data
      - whisper-models:/models

  mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      MCP_TOKEN: ${MCP_TOKEN:?MCP_TOKEN manquant dans .env}
      PORT: 3333
    volumes:
      - meetings:/data:ro
    ports:
      - "${MCP_PORT:-3333}:3333"

volumes:
  meetings:
  whisper-models:
